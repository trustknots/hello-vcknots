<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VC Knots メダル・ウォレット (Wallet)</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    /* VC 選択ステップ */
    #vcSelectStep { display: none; }
    .vc-select-card {
      border: 2px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .vc-select-card:hover { border-color: var(--color-wallet); background: #f0f7ff; }
    .vc-select-card.selected { border-color: var(--color-wallet); background: #e0f0ff; }
    .vc-select-card input[type="radio"] { accent-color: var(--color-wallet); width: 1.1rem; height: 1.1rem; flex-shrink: 0; }
    .vc-select-card-body { flex: 1; }
    .vc-select-card-title { font-weight: 700; font-size: 0.9rem; }
    .vc-select-card-sub { font-size: 0.78rem; color: var(--text-secondary); margin-top: 0.1rem; }
    .step-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .step-actions .btn { flex: 1; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <span class="badge badge-wallet">Wallet / ウォレット</span>
      <h1 style="margin-top: 0.5rem;">🎒 VC Knots Medal Wallet</h1>
      <p>あなたの獲得した VC Knots User メダル(Verifiable Credentials)を一括管理する場所です。</p>
    </header>

    <!-- アクション領域（獲得・提示） -->
    <div class="card">
      <div class="tab-container">
        <button class="tab-btn active" id="tabReceiveBtn">📥 メダルを獲得する</button>
        <button class="tab-btn" id="tabPresentBtn">📤 メダルを提示する</button>
      </div>

      <!-- メダルを獲得するコンテンツ -->
      <div class="tab-content active" id="tabReceiveContent">
        <div class="form-group" style="margin-top: 1rem;">
          <label for="offerUrl">Credential Offer URL を貼り付け</label>
          <input type="text" id="offerUrl" placeholder="openid-credential-offer://?credential_offer=...">
        </div>
        <button class="btn" id="btnReceive" style="--btn-color: var(--color-wallet);">
          <span>📥 メダルを受け取る</span>
        </button>
      </div>

      <!-- メダルを提示するコンテンツ -->
      <div class="tab-content" id="tabPresentContent">

        <!-- ステップ1: Request URL 入力 -->
        <div id="urlInputStep">
          <div class="form-group" style="margin-top: 1rem;">
            <label for="requestUrl">Presentation Request URL (要求URL) を貼り付け</label>
            <input type="text" id="requestUrl" placeholder="openid4vp://authorize?client_id=...">
          </div>
          <button class="btn" id="btnSelectVc" style="--btn-color: var(--color-wallet);">
            <span>📤 メダルを提示（検証）する</span>
          </button>
        </div>

        <!-- ステップ2: VC 選択 -->
        <div id="vcSelectStep">
          <p style="margin: 1rem 0 0.5rem; font-weight: 600; color: var(--text-primary);">
            提示するメダル（VC）を選んでください
          </p>
          <div id="vcSelectList"></div>
          <div class="step-actions">
            <button class="btn" id="btnConfirmPresent" style="--btn-color: var(--color-wallet);" disabled>
              <span>✓ この VC で提示する</span>
            </button>
            <button class="btn" id="btnCancelSelect" style="--btn-color: var(--text-secondary); background: #f3f4f6; color: var(--text-primary);">
              <span>← 戻る</span>
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- メダル一覧 -->
    <div class="card" style="box-shadow: 4px 4px 0px 0px var(--border-color);">
      <div class="card-title" style="border-color: var(--color-wallet); color: var(--color-wallet);">
        <span>🏅 マイ・メダルコレクション</span>
      </div>

      <div id="noMedals" class="no-medals">
        <p style="font-size: 3rem; margin-bottom: 0.5rem;">🏅</p>
        <p style="font-weight: 600; color: var(--text-primary);">メダルがまだありません</p>
        <p style="font-size: 0.9rem; margin-top: 0.25rem;">Issuer 画面からメダルを発行し、獲得してください！</p>
      </div>

      <div id="medalsGrid" class="medals-grid" style="display: none;">
        <!-- JSで動的に追加されます -->
      </div>
    </div>

    <footer>
      <p>&copy; 2026 VC Knots Project - Powered by VC Knots Library</p>
    </footer>
  </div>

  <script>
    const tabReceiveBtn = document.getElementById('tabReceiveBtn');
    const tabPresentBtn = document.getElementById('tabPresentBtn');
    const tabReceiveContent = document.getElementById('tabReceiveContent');
    const tabPresentContent = document.getElementById('tabPresentContent');

    const btnReceive = document.getElementById('btnReceive');
    const offerUrlInput = document.getElementById('offerUrl');
    const requestUrlInput = document.getElementById('requestUrl');

    const noMedals = document.getElementById('noMedals');
    const medalsGrid = document.getElementById('medalsGrid');

    const urlInputStep = document.getElementById('urlInputStep');
    const vcSelectStep = document.getElementById('vcSelectStep');
    const vcSelectList = document.getElementById('vcSelectList');
    const btnSelectVc = document.getElementById('btnSelectVc');
    const btnConfirmPresent = document.getElementById('btnConfirmPresent');
    const btnCancelSelect = document.getElementById('btnCancelSelect');
    let isPresenting = false;

    // タブ切り替え
    tabReceiveBtn.addEventListener('click', () => {
      tabReceiveBtn.classList.add('active');
      tabPresentBtn.classList.remove('active');
      tabReceiveContent.classList.add('active');
      tabPresentContent.classList.remove('active');
    });

    tabPresentBtn.addEventListener('click', () => {
      tabPresentBtn.classList.add('active');
      tabReceiveBtn.classList.remove('active');
      tabPresentContent.classList.add('active');
      tabReceiveContent.classList.remove('active');
    });

    // VC 選択ステップへ切り替え
    btnSelectVc.addEventListener('click', async () => {
      const requestUrl = requestUrlInput.value.trim();
      if (!requestUrl) {
        alert('要求URLを貼り付けてください！');
        return;
      }

      btnSelectVc.disabled = true;
      btnSelectVc.innerHTML = '<span class="spinner"></span> <span>メダルを読み込み中...</span>';

      try {
        const response = await fetch('/api/credentials');
        const credentials = await response.json();
        if (!credentials || credentials.length === 0) {
          alert('提示できるメダルがありません。先にメダルを獲得してください。');
          return;
        }

        renderVcSelectList(credentials);
        urlInputStep.style.display = 'none';
        vcSelectStep.style.display = 'block';
      } catch (err) {
        alert('エラーが発生しました: ' + err.message);
        console.error(err);
      } finally {
        btnSelectVc.disabled = false;
        btnSelectVc.innerHTML = '<span>📤 メダルを提示（検証）する</span>';
      }
    });

    // VC 選択リストを描画
    function renderVcSelectList(credentials) {
      vcSelectList.innerHTML = '';
      btnConfirmPresent.disabled = true;

      credentials.forEach((cred) => {
        const claims = cred.claims || {};
        const username = claims.username || 'Explorer';
        const level = claims.user_level;
        const issuedAt = claims.issued_at ? new Date(claims.issued_at).toLocaleString() : '不明';

        const card = document.createElement('label');
        card.className = 'vc-select-card';

        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'vcChoice';
        radio.value = cred.id;

        const body = document.createElement('div');
        body.className = 'vc-select-card-body';

        const titleEl = document.createElement('div');
        titleEl.className = 'vc-select-card-title';
        titleEl.textContent = `🏅 VC Knots User Medal — ${username}`;

        const subEl = document.createElement('div');
        subEl.className = 'vc-select-card-sub';
        subEl.textContent = (level ? `Level: ${level} | ` : '') + `獲得日: ${issuedAt}`;

        body.appendChild(titleEl);
        body.appendChild(subEl);
        card.appendChild(radio);
        card.appendChild(body);

        radio.addEventListener('change', () => {
          if (isPresenting) return;
          document.querySelectorAll('.vc-select-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          btnConfirmPresent.disabled = false;
        });

        vcSelectList.appendChild(card);

        // VCが1件だけなら自動選択
        if (credentials.length === 1) {
          radio.checked = true;
          card.classList.add('selected');
          btnConfirmPresent.disabled = false;
        }
      });
    }

    // 戻るボタン
    btnCancelSelect.addEventListener('click', () => {
      if (isPresenting) return;
      vcSelectStep.style.display = 'none';
      urlInputStep.style.display = 'block';
    });

    // 提示実行
    btnConfirmPresent.addEventListener('click', async () => {
      if (isPresenting) return;
      const selected = document.querySelector('input[name="vcChoice"]:checked');
      if (!selected) return;

      const credentialId = selected.value;
      const requestUrl = requestUrlInput.value.trim();

      isPresenting = true;
      btnCancelSelect.disabled = true;
      vcSelectList.querySelectorAll('input[name="vcChoice"]').forEach(radio => radio.disabled = true);
      btnConfirmPresent.disabled = true;
      btnConfirmPresent.innerHTML = '<span class="spinner"></span> <span>提示中...</span>';

      try {
        const response = await fetch('/api/present', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ request_url: requestUrl, credential_id: credentialId })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Failed to present medal');
        }

        alert('✓ メダルを正常に提示しました！\nVerifier画面を確認してください。');
        requestUrlInput.value = '';
        vcSelectStep.style.display = 'none';
        urlInputStep.style.display = 'block';

      } catch (err) {
        alert('エラーが発生しました: ' + err.message);
        console.error(err);
      } finally {
        isPresenting = false;
        btnCancelSelect.disabled = false;
        vcSelectList.querySelectorAll('input[name="vcChoice"]').forEach(radio => radio.disabled = false);
        btnConfirmPresent.disabled = false;
        btnConfirmPresent.innerHTML = '<span>✓ この VC で提示する</span>';
      }
    });

    // 1. 保有クレデンシャル一覧のロード
    async function loadCredentials() {
      try {
        const response = await fetch('/api/credentials');
        const credentials = await response.json();

        if (!credentials || credentials.length === 0) {
          noMedals.style.display = 'block';
          medalsGrid.style.display = 'none';
          return;
        }

        noMedals.style.display = 'none';
        medalsGrid.style.display = 'grid';
        medalsGrid.innerHTML = '';

        credentials.forEach(cred => {
          const claims = cred.claims || {};
          const username = claims.username || 'Explorer';
          const issuedAt = claims.issued_at ? new Date(claims.issued_at).toLocaleString() : '不明';
          const level = claims.user_level;

          const card = document.createElement('div');
          card.className = 'medal-card';

          const iconEl = document.createElement('div');
          iconEl.className = 'medal-card-icon';
          iconEl.textContent = '🏅';

          const badgeEl = document.createElement('div');
          badgeEl.className = 'badge badge-success';
          badgeEl.textContent = 'VC / メダル';

          const titleEl = document.createElement('div');
          titleEl.className = 'medal-card-title';
          titleEl.textContent = 'VC Knots User Medal';

          const detailEl = document.createElement('div');
          detailEl.className = 'medal-card-detail';
          detailEl.style.marginTop = '0.5rem';

          const addDetailRow = (label, value) => {
            const strong = document.createElement('strong');
            strong.textContent = label;
            detailEl.appendChild(strong);
            detailEl.appendChild(document.createTextNode(' ' + value));
            detailEl.appendChild(document.createElement('br'));
          };
          addDetailRow('Username:', username);
          if (level) addDetailRow('Level:', level);

          const dateSpan = document.createElement('span');
          dateSpan.style.cssText = 'font-size: 0.75rem; color: var(--text-muted); display: block; margin-top: 0.25rem;';
          dateSpan.textContent = `獲得日: ${issuedAt}`;
          detailEl.appendChild(dateSpan);

          card.appendChild(iconEl);
          card.appendChild(badgeEl);
          card.appendChild(titleEl);
          card.appendChild(detailEl);
          medalsGrid.appendChild(card);
        });

      } catch (err) {
        console.error('Failed to load credentials:', err);
      }
    }

    // 2. メダル獲得 (Receive)
    btnReceive.addEventListener('click', async () => {
      const offerUrl = offerUrlInput.value.trim();
      if (!offerUrl) {
        alert('Offer URLを貼り付けてください！');
        return;
      }

      btnReceive.disabled = true;
      btnReceive.innerHTML = '<span class="spinner"></span> <span>メダルを獲得中...</span>';

      try {
        const response = await fetch('/api/receive', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ offer_url: offerUrl })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Failed to claim medal');
        }

        alert('🎉 メダルを正常に獲得しました！');
        offerUrlInput.value = '';
        await loadCredentials();

      } catch (err) {
        alert('エラーが発生しました: ' + err.message);
        console.error(err);
      } finally {
        btnReceive.disabled = false;
        btnReceive.innerHTML = '<span>📥 メダルを受け取る</span>';
      }
    });

    window.addEventListener('DOMContentLoaded', loadCredentials);
  </script>
</body>
</html>
